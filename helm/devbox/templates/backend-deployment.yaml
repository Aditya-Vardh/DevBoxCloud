apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devbox.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ include "devbox.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "devbox.fullname" . }}-backend
    spec:
      serviceAccountName: {{ include "devbox.fullname" . }}-sa
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "devbox.fullname" . }}-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "devbox.postgresSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devbox.postgresSecretName" . }}
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
