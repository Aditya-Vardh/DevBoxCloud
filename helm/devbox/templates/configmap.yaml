apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devbox.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
data:
  DB_URL: "jdbc:postgresql://{{ include "devbox.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
  K8S_NAMESPACE: {{ .Values.namespace | quote }}
  MINIKUBE_ENABLED: {{ .Values.minikubeEnabled | quote }}
