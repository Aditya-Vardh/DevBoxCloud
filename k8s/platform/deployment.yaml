apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnad32
  namespace: cnad32-platform
  labels:
    app.kubernetes.io/name: cnad32
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnad32
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnad32
    spec:
      serviceAccountName: cnad32-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cnad32
          image: ghcr.io/replace-with-your-org/cnad32:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: cnad32-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
