pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr notice;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  client_max_body_size 10m;

  server {
    listen 8080;
    server_name _;

    # ── Health probe ─────────────────────────────────────────────────────────
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ready\n";
    }

    # ── Workspace landing page ────────────────────────────────────────────────
    location = / {
      root /var/lib/devbox;
      try_files /index.html =503;
      add_header Cache-Control "no-cache";
    }

    # ── Browser terminal (ttyd) ───────────────────────────────────────────────
    # All requests under /terminal/ proxy to ttyd:7681.
    # The trailing slash in proxy_pass strips the /terminal prefix so ttyd
    # receives /  and /ws correctly.
    location /terminal/ {
      proxy_pass            http://127.0.0.1:7681/;
      proxy_http_version    1.1;
      proxy_set_header Host             $host;
      proxy_set_header Upgrade          $http_upgrade;
      proxy_set_header Connection       "upgrade";
      proxy_set_header X-Real-IP        $remote_addr;
      proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering     off;
    }

    # ── Desktop redirect ─────────────────────────────────────────────────────
    location = /desktop {
      return 301 /desktop/;
    }

    # ── noVNC static files ───────────────────────────────────────────────────
    location /desktop/ {
      alias /usr/share/novnc/;
      index vnc.html vnc_lite.html;
      try_files $uri $uri/ =404;
    }

    # ── WebSocket bridge for noVNC (primary path) ────────────────────────────
    location /websockify {
      proxy_pass            http://127.0.0.1:6080;
      proxy_http_version    1.1;
      proxy_set_header Host                   $host;
      proxy_set_header Upgrade                $http_upgrade;
      proxy_set_header Connection             "upgrade";
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering     off;
    }

    # ── WebSocket bridge (alternate path kept for compatibility) ─────────────
    location /desktop/websockify {
      proxy_pass            http://127.0.0.1:6080;
      proxy_http_version    1.1;
      proxy_set_header Host                   $host;
      proxy_set_header Upgrade                $http_upgrade;
      proxy_set_header Connection             "upgrade";
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering     off;
    }
  }
}
