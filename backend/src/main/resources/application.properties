# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devboxdb}
spring.datasource.username=${DB_USERNAME:devbox}
spring.datasource.password=${DB_PASSWORD:devbox123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Kubernetes ──────────────────────────────────────────────────────────────
devbox.kubernetes.namespace=${K8S_NAMESPACE:devbox}
devbox.kubernetes.minikube=${MINIKUBE_ENABLED:true}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.devbox=INFO
logging.level.io.kubernetes=WARN
