# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.address=0.0.0.0

# ─── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devboxdb}
spring.datasource.username=${DB_USERNAME:devbox}
spring.datasource.password=${DB_PASSWORD:devbox123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Kubernetes ──────────────────────────────────────────────────────────────
devbox.kubernetes.namespace=${K8S_NAMESPACE:devbox}
devbox.kubernetes.minikube=${MINIKUBE_ENABLED:true}

# ─── Workspace URL host ───────────────────────────────────────────────────────
# Host used in workspace terminal/desktop URLs returned to the browser.
# Default: 127.0.0.1 (only accessible from this machine).
# For LAN expo demos, set this to your machine's Wi-Fi IP, e.g.:
#   DEVBOX_WORKSPACE_HOST=192.168.1.9  .\mvnw.cmd spring-boot:run
# Then workspace terminal/desktop links will work from any device on the same Wi-Fi.
# The kubectl port-forward will bind on 0.0.0.0 so LAN clients can reach it.
devbox.workspace.host=${DEVBOX_WORKSPACE_HOST:127.0.0.1}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.devbox=INFO
logging.level.io.kubernetes=WARN
